; =================================================================
;            Syntax Highlighting Rules for Mini-IDE
; =================================================================
;
; Rules:
; - Section name is the file extension (without the dot).
; - Key is the color name (Blue, Green, Purple, Gray, Red).
; - Value is a comma-separated list of keywords.
; - For comments/strings, list the starting character (e.g., # for Python).
;   The current parser only supports single-line comments starting
;   with a specific character.

[py]
; Python
Blue=if,else,elif,for,while,def,class,import,from,return,try,except,finally,with,as,lambda,yield,in,is,not,and,or,break,continue,pass,global,nonlocal,async,await,del,assert
Green=True,False,None
Purple=print,len,str,int,float,list,dict,set,tuple,range,open,super,self,isinstance,type,id,input,zip,map,filter,sorted,sum,min,max,abs,round
Gray=#
Red=",'

