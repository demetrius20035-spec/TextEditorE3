[Run]
Executable=python
FileName=source.py
Arguments=10 20

; Запуск по расширению: если у открытого файла расширение есть в [Interpreters],
; запускается именно этот файл указанным интерпретатором (а не source.py).
; Пусто/без секции — используется конфигурация [Run] выше.
[Interpreters]
py=python
js=node
rb=ruby
php=php
pl=perl
lua=lua
